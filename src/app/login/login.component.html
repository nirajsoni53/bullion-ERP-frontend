<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  
  <div class="max-w-md w-full bg-white p-8 rounded-3xl border border-slate-200 shadow-xl space-y-6">
    
    <!-- Logo & Header -->
    <div class="text-center space-y-2">
      <div class="w-12 h-12 bg-blue-600 text-white font-black rounded-2xl flex items-center justify-center mx-auto text-xl shadow-lg shadow-blue-500/30">
        B
      </div>
      <h2 class="text-2xl font-black text-slate-800 tracking-tight">
        Bullion Management
      </h2>
      <p class="text-xs text-slate-500 font-semibold">
        Sign in to manage inventory, sales, expenses, and business settings.
      </p>
    </div>

    <!-- Error Alert -->
    <div *ngIf="errorMessage" class="bg-rose-50 border border-rose-200 text-rose-600 text-xs font-semibold p-3.5 rounded-xl flex items-center gap-2">
      <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span>{{ errorMessage }}</span>
    </div>

    <!-- Login Form -->
    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-4">
      
      <!-- Email Input -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email Address</label>
        <input 
          type="email" 
          formControlName="email" 
          placeholder="admin@bullion.com" 
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" 
        />
        <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')" class="text-xs text-rose-500 font-medium mt-1 block">
          Email is required
        </span>
        <span *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')" class="text-xs text-rose-500 font-medium mt-1 block">
          Please enter a valid email address
        </span>
      </div>

      <!-- Password Input -->
      <div>
        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
        <input 
          type="password" 
          formControlName="password" 
          placeholder="••••••••" 
          class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl font-semibold text-slate-800 focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm" 
        />
        <span *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')" class="text-xs text-rose-500 font-medium mt-1 block">
          Password is required
        </span>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        [disabled]="loginForm.invalid"
        class="w-full py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-50 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transition-all text-sm mt-2">
        Sign In
      </button>

    </form>

    <!-- Static Credentials Helper Box -->
    <div class="bg-slate-50 p-3.5 rounded-2xl border border-slate-200 text-center space-y-1">
      <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider">Demo Credentials</p>
      <p class="text-xs font-mono font-semibold text-slate-700">
        Email: <span class="text-blue-600">admin&#64;bullion.com</span>
      </p>
      <p class="text-xs font-mono font-semibold text-slate-700">
        Password: <span class="text-blue-600">admin123</span>
      </p>
    </div>

  </div>

</div>
