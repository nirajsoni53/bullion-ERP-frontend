<div class="sticky top-0 z-40 bg-white border-b shadow-sm">
  <div class="max-w-full mx-auto p-4">
    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-4">

      <!-- Title -->
      <div>
        <h1 class="text-3xl font-black text-gray-900">
          BULLION PRO <span class="text-blue-600">v5</span>
        </h1>
        <p class="text-xs text-gray-500 font-bold uppercase">
          Complete Enterprise Accounting Solution
        </p>
      </div>
      
      <!-- Menu Buttons -->
      <div class="inline-flex items-center p-1.5 bg-gray-100 rounded-xl border border-gray-200 shadow-inner">
        
        <a
          *ngFor="let item of menuItems"
          [routerLink]="item.route"
          routerLinkActive="bg-white text-blue-700 shadow-md ring-1 ring-black/5 font-bold"
          [routerLinkActiveOptions]="{ exact: true }"
          class="relative flex items-center gap-2 px-5 py-2.5 rounded-lg text-sm font-medium text-gray-500 hover:text-gray-900 transition-all duration-200"
        >
          <!-- Optional: Add icons here if you have them in item.icon -->
          <!-- <i [class]="item.icon"></i> -->
          
          <span class="z-10">{{ item.label }}</span>
          
          <!-- Hover effect for non-active items -->
          <span class="absolute inset-0 rounded-lg hover:bg-gray-200/50 transition-colors -z-0"></span>
        </a>
      </div>
    </div>
  </div>
</div>
