<div *ngIf="count > 0" class="absolute top-4 left-1/2 -translate-x-1/2 z-30 bg-slate-900 text-white px-6 py-3 rounded-full shadow-xl flex items-center gap-6 animate-in fade-in slide-in-from-top-4 duration-200">
  <div class="font-bold text-sm whitespace-nowrap">
    <span class="text-blue-400">{{ count }}</span> Selected
  </div>
  <div class="h-4 w-px bg-slate-700"></div>
  <div class="flex items-center gap-2">
    <button (click)="onSell.emit()" class="text-xs font-bold hover:text-green-400 flex items-center gap-1 transition-colors">
      <span>💰</span> Sell
    </button>
    <button (click)="onCancel.emit()" class="ml-4 text-xs text-slate-400 hover:text-white transition-colors">
      Cancel
    </button>
  </div>
</div>
