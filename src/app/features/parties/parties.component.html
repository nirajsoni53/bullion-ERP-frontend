<div *ngIf="page === 'PARTIES'" class="bg-white rounded-xl shadow-sm border border-slate-200 flex flex-col min-h-[600px] relative">
      
      <!-- HEADER -->

      <app-parties-header 
        [totalItems]="filteredParties.length"
        [searchTerm]="searchTerm"
        [balanceFilter]="balanceFilter"
        (searchChange)="searchTerm = $event; applyFilters()"
        (filterChange)="balanceFilter = $event; applyFilters()"
        (addParty)="openCreateModal()"
        (openSettlement)="openSettlementModal(null)"> 
      </app-parties-header>

      <!-- TABLE -->
      <div class="mt-4">
        <app-party-table
          [parties]="filteredParties"
          (viewDetails)="viewPartyDetails($event)"
          (edit)="openEditModal($event)"
          (delete)="deleteParty($event)"
          (settle)="openSettlementModal($event)">
        </app-party-table>
      </div>

      <!-- PAGINATION -->
      <app-pagination-footer
        [page]="currentPage"
        [pageSize]="pageSize"
        [total]="filteredParties.length"
        (pageChange)="setPage($event)"
        (pageSizeChange)="onPageSizeChange($event)">
      </app-pagination-footer>

      <!-- ADD/EDIT FORM MODAL -->
      <app-party-form
        [isOpen]="isModalOpen"
        [isSaving]="isSaving"
        [partyId]="currentPartyId"
        [initialData]="editingPartyData"
        (close)="closeModal()"
        (save)="handleSaveParty($event)">
      </app-party-form>

      <!-- DELETE CONFIRMATION -->
      <app-delete-confirmation
        [isOpen]="isDeleteModalOpen"
        [isDeleting]="isDeleting"
        [itemName]="partyToDelete?.name"
        (close)="closeDeleteModal()"
        (confirm)="confirmDelete()">
      </app-delete-confirmation>

      <!-- Just above the closing </div> of Parties component -->

      <!-- SETTLEMENT MODAL -->
      <app-settlement-modal
        [isOpen]="isSettlementModalOpen"
        [parties]="allParties"
        [preSelectedPartyId]="settlementPartyId"
        (close)="closeSettlementModal()"
        (settled)="handleSettled()">
      </app-settlement-modal>
    </div>
