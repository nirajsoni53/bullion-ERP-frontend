<div class="bg-white rounded-xl shadow-sm border p-6">
  <div class="flex justify-between items-center mb-4">
    <h2 class="text-2xl font-black">Expense Ledger</h2>
    <button (click)="modals.expense = true" class="px-4 py-2 bg-red-600 text-white font-bold rounded-lg">+ Add Expense</button>
  </div>

  <table class="w-full text-sm">
    <thead class="bg-gray-100 border-b">
      <tr>
        <th class="p-2 text-left">Date</th>
        <th class="p-2">Title</th>
        <th class="p-2 text-right">Amount</th>
        <th class="p-2 text-center">Action</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let e of expenses; else noExpenses" class="border-b">
        <td class="p-2">{{ e.date }}</td>
        <td class="p-2 font-bold">{{ e.title }}</td>
        <td class="p-2 text-right text-red-600 font-bold">{{ fmtINR(e.amount) }}</td>
        <td class="p-2 text-center">
          <button (click)="deleteExpense(e.id)" class="text-red-500 hover:text-red-700 text-xs font-bold">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <ng-template #noExpenses>
    <tr><td colspan="4" class="p-4 text-center text-gray-400">No Expenses</td></tr>
  </ng-template>
</div>
